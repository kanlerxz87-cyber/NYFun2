name: Publish research dashboard to GitHub Pages

on:
  push:
    branches:
      - arena/215c2a25-nyfun2
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: arena/215c2a25-nyfun2
      - name: Validate data and local links
        run: |
          python3 - <<'PY'
          import json, pathlib, re, sys
          root = pathlib.Path('.')
          problems = []
          for f in root.glob('data/*.json'):
              try:
                  json.load(open(f))
              except Exception as exc:
                  problems.append(f'{f}: {exc}')
          sources = json.load(open('data/sources.json'))['sources']
          for name in ('restaurants', 'activities', 'hotels'):
              data = json.load(open(f'data/{name}.json'))
              for row in data['rows']:
                  for sid in row.get('sources', []):
                      if sid not in sources:
                          problems.append(f'{name}/{row.get("name")}: missing source {sid}')
          for f in list(root.glob('*.html')) + list((root / 'pages').glob('*.html')):
              for href in re.findall(r'(?:href|src)="([^"]+)"', f.read_text()):
                  if href.startswith(('http:', 'https:', 'mailto:', '#', 'tel:')):
                      continue
                  if not (f.parent / href).resolve().exists():
                      problems.append(f'{f}: broken local link {href}')
          if problems:
              print('\n'.join(problems))
              sys.exit(1)
          print('Data JSON valid; all source IDs resolve; all local links exist.')
          PY
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
